name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - name: Run deterministic offline tests
        shell: bash
        run: |
          mv gltest.config.yaml gltest.config.live.yaml
          trap 'mv gltest.config.live.yaml gltest.config.yaml' EXIT
          python -m pytest tests/model tests/static -q
      - run: genvm-lint check contracts/referral_rail.py
      - run: genvm-lint check contracts/outcome_judge.py
      - run: genvm-lint check contracts/referral_rail_v2.py
      - run: genvm-lint check contracts/outcome_judge_v2.py
      - run: genvm-lint check contracts/referral_identity_v2.py
      - run: npm run typecheck
      - run: npm run build
      - run: python scripts/preflight.py --skip-tests

