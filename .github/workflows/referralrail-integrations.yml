name: ReferralRail integrations

on:
  push:
    paths: ["integrations/**", ".agents/skills/referralrail/**", "docs/integrations/**", ".github/workflows/referralrail-integrations.yml"]
  pull_request:
    paths: ["integrations/**", ".agents/skills/referralrail/**", "docs/integrations/**", ".github/workflows/referralrail-integrations.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck --workspace @referralrail/sdk
      - run: npm run test --workspace @referralrail/sdk
      - run: npm run build --workspace @referralrail/sdk
      - run: npm run typecheck --workspace @referralrail/mcp
      - run: npm run test --workspace @referralrail/mcp
      - run: npm run build --workspace @referralrail/mcp
      - run: npm run stdio:e2e --workspace @referralrail/mcp
      - run: npm pack --dry-run --workspace @referralrail/sdk
      - run: npm pack --dry-run --workspace @referralrail/mcp
      - run: node scripts/validate_referralrail_skill.mjs
      - run: git diff --exit-code -- contracts frontend deploy deployment
      - name: Secret scan
        shell: bash
        run: '! rg -n "0x[a-fA-F0-9]{64}" integrations .agents/skills/referralrail --glob "!*.example" -g "!dist/**"'
